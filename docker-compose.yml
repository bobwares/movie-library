services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-movie_library}
      POSTGRES_USER: ${POSTGRES_USER:-movie_library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movie_library_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie_library_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  movie_library_postgres:
